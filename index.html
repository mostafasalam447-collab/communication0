<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Bank - Full List</title>
    <style>
        :root {
            --primary: #004a7c;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* لوحة العدادات العلوية الثابتة */
        .header-stats {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg);
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 700px;
        }

        .stat-card {
            background: var(--white);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        .stat-value {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
        }

        /* حاوية الأسئلة */
        .questions-container {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }

        .quiz-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        .q-number-badge {
            position: absolute;
            top: 15px;
            left: 15px; /* لليسار لأن النص إنجليزي */
            background: var(--secondary);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 20px;
            margin-top: 10px;
            line-height: 1.5;
            text-align: left;
            direction: ltr;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: var(--white);
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-align: left;
            direction: ltr;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f7ff;
            border-color: var(--secondary);
        }

        /* حالات الإجابة */
        .correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24 !important;
        }

        .submit-all {
            margin: 40px 0;
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-stats">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value">50</span>
                <span class="stat-label">الإجمالي</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-answered">0</span>
                <span class="stat-label">أجبت</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-correct" style="color: var(--success);">0</span>
                <span class="stat-label">صحيحة</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-percent">0%</span>
                <span class="stat-label">النجاح</span>
            </div>
        </div>
    </div>

    <div class="questions-container" id="main-container">
        </div>

    <button class="submit-all" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">العودة للأعلى</button>

<script>
    const questions = [
        { q: "1. As regards communication, barriers of messages include which of the following?", o: ["Easy messages", "Relevant messages", "Unclear messages", "Complete messages"], c: 2 },
        { q: "2. Which of the following is the definition of motivation?", o: ["It is internal force that initiates and directs the individual to act in a certain manner to satisfy needs.", "It is external force", "Both 1 and 4", "Motivation starts with need, vision, dream"], c: 2 },
        { q: "3. As regards the role of the teacher, which of the following is not correct?", o: ["Planner", "Clarifier", "Stimulator", "Volunteer"], c: 3 },
        { q: "4. Group approach method of education includes which of the following?", o: ["Television", "Home visit", "Lecture", "Internet"], c: 2 },
        { q: "5. As regards importance of motivation, which of the following is not correct?", o: ["Activate behavior", "Give direction", "Increase productivity", "Passive participation"], c: 3 },
        { q: "6. Which is correct for essentials of communication?", o: ["Do not react instantly and mutter in anger", "Go to the conclusion", "Interrupt the speaker", "Use medical terminology difficult to be understood"], c: 0 },
        { q: "7. Which of the following is considered correct for verbal communication?", o: ["Need words to express emotions", "Active listening", "Direct questioning", "All the above"], c: 3 },
        { q: "8. Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "More reliable than verbal communication", "Do not need observation", "Cannot be used with deaf and mute persons"], c: 1 },
        { q: "9. Which is correct for an effective verbal communicator?", o: ["Encourages empathically", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },
        { q: "10. Which of the following are levels of communication?", o: ["Downwards communication", "Upwards communication", "Horizontal communication", "All the above"], c: 3 },
        { q: "11. Which of the following are correct for nonverbal communication?", o: ["Use body language", "Facial expression, eye contact and touch appearance", "Cannot use words", "All the above"], c: 3 },
        { q: "12. Risk factors that cause health education problems include:", o: ["Good staff training", "Spend time to interact properly with clients", "Good interest in the subject", "Lack staff training"], c: 3 },
        { q: "13. Group approach of health education include which of the following?", o: ["Internet", "Lectures, workshops and conferences", "Home visit", "Television"], c: 1 },
        { q: "14. Which of the following are the advantages of group teaching?", o: ["Include small group only", "Economic and give positive attitude development", "High cost", "Lack of sharing between learners"], c: 1 },
        { q: "15. As regards importance of motivation, which of the following is not correct?", o: ["Intrinsic force", "Give direction", "Increase productivity", "Extrinsic force"], c: 3 },
        { q: "16. Defined as two-way process involving passing messages to and from between sender and receiver:", o: ["Motivation", "Communication", "Health education code of ethics", "Learning"], c: 1 },
        { q: "17. Which of the following is considered correct for nonverbal communication?", o: ["Need words to express emotions", "Need observation and understanding", "Direct questioning", "Need voice"], c: 1 },
        { q: "18. Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "Non reliable than verbal communication", "Do not need observation", "Use body language"], c: 3 },
        { q: "19. Which is correct for an effective verbal communicator?", o: ["Direct clear questioning", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },
        { q: "20. Which of the following is a type of communication?", o: ["Downwards communication", "Upwards communication", "Horizontal communication", "All the above"], c: 3 },
        { q: "21. Which of the following is not correct about the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "Non appropriate channel"], c: 3 },
        { q: "22. An effective verbal communicator include:", o: ["Clarifies, listens, acknowledges and repeats", "Relaxes", "Opens up", "Eye contact"], c: 0 },
        { q: "23. Which of the following are the types of communication?", o: ["Verbal only", "Nonverbal only", "Intermediate", "Verbal and nonverbal"], c: 3 },
        { q: "24. Which of the following are correct for verbal communication?", o: ["Use body language", "Use words in communication", "Facial expression, eye contact and touch appearance", "Cannot use words"], c: 1 },
        { q: "25. Which of the following is not the level of communication?", o: ["Downward communication", "Upwards communication", "Lateral communication", "Vertical communication"], c: 2 },
        { q: "26. Which of the following are characters of a good sender message in communication?", o: ["Choose appropriate communication channel", "Be interested in the subject", "Both 1 and 2", "Lack interest of subject"], c: 2 },
        { q: "27. … is the person to whom messages is directed.", o: ["Sender", "Receiver", "Channel", "Messages"], c: 1 },
        { q: "28. Final stage that the receiver replies to the sender according to understanding:", o: ["Sending", "Communication", "Feedback", "Receiving"], c: 2 },
        { q: "29. As regards nonverbal communication advantages, which is correct?", o: ["Need words", "Do not need understanding or interpretation", "More reliable than verbal", "Need high voice"], c: 2 },
        { q: "30. All the following are requirements of effective communication EXCEPT:", o: ["Clear messages", "Relevant messages", "Meaningful messages", "Non relevant messages"], c: 3 },
        { q: "31. Criteria of effective nonverbal communicator include:", o: ["Use clear voice", "Establish eye contact with facial expression", "Use words", "Use meaningful speech"], c: 1 },
        { q: "32. … is considered as a barrier of communication:", o: ["Proper channel", "Improper channel", "Good channel", "Relevant channel"], c: 1 },
        { q: "33. Teaching is defined as:", o: ["Interaction to bring expected changes in behavior", "Interaction between learners", "Interaction between groups", "Interaction between clients"], c: 0 },
        { q: "34. As regard rules of motivation which is correct?", o: ["Do not finish what you start", "Do not socialize", "Take risk and set a major goal", "Do not learn how to learn"], c: 2 },
        { q: "35. Which of the following is not a barrier of communication?", o: ["Lack of interest", "Good language use", "Anxiety", "Impaired visual channel"], c: 1 },
        { q: "36. Which are considered barriers of messages in communication?", o: ["Difficult and irrelevant messages", "Very easy messages", "Clear messages", "Complete messages"], c: 0 },
        { q: "37. For uncomfortable settings, which is correct?", o: ["Irrelevant", "Not essentials", "Are barriers of communication", "Receiver can concentrate"], c: 2 },
        { q: "38. As regards upwards communication which is true?", o: ["From below downward", "Nondirective", "Give information", "All the above"], c: 3 },
        { q: "39. Which is considered correct for verbal communication?", o: ["Need open-ended technique", "Close-ended technique", "Open and close-ended technique", "Not relevant"], c: 2 },
        { q: "40. Which is correct for nonverbal communication?", o: ["Direct questioning", "Need words", "Less conscious control over behavior", "Good conscious control"], c: 2 },
        { q: "41. Which is the characteristic of nonverbal communication?", o: ["Need good observation", "More reliable than verbal", "Need interpretation", "All the above"], c: 3 },
        { q: "42. Which is the disadvantage of individual approach teaching?", o: ["High cost", "Economic", "Positive attitude development", "Low cost"], c: 0 },
        { q: "43. Which is correct for the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "All the above"], c: 3 },
        { q: "44. As regards communication, feedback should not be:", o: ["Absent feedback", "Relevant feedback", "Good feedback", "Complete feedback"], c: 0 },
        { q: "45. Responsibility of sender is:", o: ["Discourage his receivers", "Encourage the receivers", "Has no relation", "Work alone"], c: 1 },
        { q: "46. Which of the following is the definition of health education?", o: ["Experience designed to facilitate voluntary action", "Unvoluntary action", "It is force", "Unhealthy behavior"], c: 0 },
        { q: "47. As regard the role of the teacher which is not correct?", o: ["Planner", "Clarifier", "Stimulator", "Volunteer"], c: 3 },
        { q: "48. As regard nonverbal communication represents:", o: ["90%", "80%", "70%", "10%"], c: 0 },
        { q: "49. Which is considered correct for verbal communication?", o: ["Need words to express emotions", "Active listening", "Direct questioning", "All the above"], c: 3 },
        { q: "50. Which is the characteristic of nonverbal communication?", o: ["Easy communication", "NOT reliable", "Do not need observation", "Used with deaf and mute"], c: 1 }
    ];

    let score = 0;
    let answered = 0;

    function buildQuiz() {
        const container = document.getElementById("main-container");
        questions.forEach((item, qIdx) => {
            const card = document.createElement("div");
            card.className = "quiz-card";
            card.id = `card-${qIdx}`;

            card.innerHTML = `
                <div class="q-number-badge">${qIdx + 1}</div>
                <div class="question-text">${item.q}</div>
                <div class="options-list" id="options-${qIdx}"></div>
            `;
            container.appendChild(card);

            const optionsBox = document.getElementById(`options-${qIdx}`);
            item.o.forEach((opt, oIdx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleChoice(qIdx, oIdx, btn);
                optionsBox.appendChild(btn);
            });
        });
    }

    function handleChoice(qIdx, oIdx, clickedBtn) {
        const optionsBox = document.getElementById(`options-${qIdx}`);
        const buttons = optionsBox.querySelectorAll(".option-btn");
        const correctIdx = questions[qIdx].c;

        // تعطيل الأزرار فوراً لتثبيت الإجابة
        buttons.forEach(btn => btn.disabled = true);

        if (oIdx === correctIdx) {
            clickedBtn.classList.add("correct");
            score++;
        } else {
            clickedBtn.classList.add("wrong");
            buttons[correctIdx].classList.add("correct");
        }

        answered++;
        updateHeader();
    }

    function updateHeader() {
        document.getElementById("stat-answered").innerText = answered;
        document.getElementById("stat-correct").innerText = score;
        const percent = Math.round((score / answered) * 100);
        document.getElementById("stat-percent").innerText = percent + "%";
    }

    buildQuiz();
</script>
</body>
</html>
