<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Communication Exam</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
#topBar{
 position:sticky;top:0;background:#222;color:#fff;
 padding:12px;font-size:18px;display:flex;gap:25px;align-items:center;z-index:999
}
#questions{padding:20px}
.question{background:#fff;margin-bottom:15px;padding:15px;border-radius:8px}
.option{display:block;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:5px;cursor:pointer}
.option.correct{background:#b6fcb6}
.option.wrong{background:#ffb6b6}
</style>
</head>
<body>

<div id="topBar">
✔ Correct: <span id="correct">0</span>
✖ Wrong: <span id="wrong">0</span>
📊 Percentage: <span id="percent">0</span>%
<button onclick="resetExam()">Reset</button>
</div>

<div id="questions"></div>

<script>
// ================== أول 20 سؤال ==================
const questions = [
  {q:"As regards communication, barriers of messages include which of the following?",o:["Easy messages.","Relevant messages.","Unclear messages.","Complete messages."],a:2},
  {q:"Which of the following is the definition of motivation?",o:["It is internal force that initiates and directs the individual.","It is external force.","Both 1 and 4.","Motivation starts with need, vision, dream."],a:0},
  {q:"As regards the role of the teacher, which of the following is not correct?",o:["Planner.","clarifier.","Stimulator.","volunteer."],a:3},
  {q:"Group approach method of education includes which of the following?",o:["Television.","Home visit.","Lecture.","Internet."],a:2},
  {q:"As regards, Importance of motivation which of the following is not correct?",o:["Activate behavior.","Give direction.","Increase productivity.","Passive participation."],a:3},
  {q:"Which is correct for essentials of communication?",o:["Do not react instantaly and mutter in angers.","Go to the conclusion.","Interrupt the speaker.","Use medical terminology difficult to be understanded."],a:0},
  {q:"Which of the following is considered correct for verbal communication?",o:["Need words to express emotions.","Active listening.","Direct questioning.","All of the above."],a:3},
  {q:"Which of the following is the characteristic of nonverbal communication?",o:["Easy communication.","More reliable than verbal communication.","Do not need observation.","Cannot be use with deaf and mute persons."],a:1},
  {q:"Which is correct for an effective verbal communicator?",o:["Encourages empathically.","Depend on eye contact.","Depend on facial expression.","Depend on body language."],a:0},
  {q:"Which of the following are levels of communication?",o:["Downwards communication.","Upwards communication.","Horizontal communication.","All the above."],a:3},
  {q:"Which of the following are correct for nonverbal communication?",o:["Use body language.","Facial expression, eye contact and touch appearance.","Cannot use words.","All the above."],a:3},
  {q:"Risk factors that cause health education problem include:",o:["Good staff training.","Spend time to interact properly with clients.","Good interest in the subject.","Lack staff training."],a:3},
  {q:"Group approach of health education include which of the following?",o:["Internet.","Lectures, workshop and conference.","Home visit.","Television."],a:1},
  {q:"Which of the following are the advantages of group teaching?",o:["Include small group only.","Economic and give positive attitude development.","High cost.","Lack of sharing between learners."],a:1},
  {q:"As regards, importance of motivation which of the following is not correct?",o:["Intrinsic force.","Give direction.","Increase productivity.","Extrinsic force."],a:3},
  {q:"Defined as two way process involving passing messages between sender and receiver?",o:["Motivation.","Communication.","Health education code of ethics.","Learning."],a:1},
  {q:"Which of the following is considered correct for nonverbal communication?",o:["Need words to express emotions.","Need observation and understanding.","Direct questioning.","Need voice."],a:1},
  {q:"Which of the following is the characteristic of nonverbal communication?",o:["Easy communication.","Non reliable than verbal communication.","Do not need observation.","Use body language."],a:3},
  {q:"Which is correct for an effective verbal communicator?",o:["Direct clear questioning.","Depend on eye contact.","Depend on facial expression.","Depend on body language."],a:0},
  {q:"Which of the following is a type of communication?",o:["Downwards communication.","Upwards communication.","Horizontal communication.","All the above."],a:3}
];

// ================== المحرك ==================
let correct = 0, wrong = 0, answered = 0;

function load(){
  const div = document.getElementById("questions");
  questions.forEach((q,i)=>{
    let d = document.createElement("div");
    d.className = "question";
    d.innerHTML = `<h3>${i+1}. ${q.q}</h3>`;
    q.o.forEach((op,idx)=>{
      let b = document.createElement("div");
      b.className = "option";
      b.innerText = op;
      b.onclick = () => answer(b, idx, q.a);
      d.appendChild(b);
    });
    div.appendChild(d);
  });
}

function answer(el, idx, ans){
  if(el.parentNode.classList.contains("done")) return;
  el.parentNode.classList.add("done");
  if(idx === ans){
    el.classList.add("correct");
    correct++;
  } else {
    el.classList.add("wrong");
    wrong++;
  }
  answered++;
  document.getElementById("correct").innerText = correct;
  document.getElementById("wrong").innerText = wrong;
  document.getElementById("percent").innerText = Math.round(correct/answered*100);
}

function resetExam(){
  location.reload();
}

// تحميل الأسئلة عند فتح الصفحة
load();
</script>

</body>
</html>
