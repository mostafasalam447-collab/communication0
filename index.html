<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Question Bank</title>
    <style>
        :root {
            --primary: #004a7c;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* لوحة العدادات العلوية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--white);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }

        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        /* كارت السؤال */
        .quiz-card {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            margin-bottom: 20px;
        }

        .q-number-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 25px;
            padding-left: 45px; /* مساحة للرقم */
            line-height: 1.5;
            text-align: left;
            direction: ltr;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--white);
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-align: left;
            direction: ltr;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f7ff;
            border-color: var(--secondary);
        }

        /* ألوان الإجابة بعد الاختيار */
        .correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24 !important;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            display: none; /* تظهر فقط بعد الإجابة */
        }

        .result-screen {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h2 style="color: var(--primary); margin-bottom: 20px;">Communication Final Bank</h2>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-value" id="stat-total">50</span>
            <span class="stat-label">إجمالي الأسئلة</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="stat-answered">0</span>
            <span class="stat-label">تمت الإجابة</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="stat-correct" style="color: var(--success);">0</span>
            <span class="stat-label">صحيحة</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="stat-percent">0%</span>
            <span class="stat-label">نسبة النجاح</span>
        </div>
    </div>

    <div class="quiz-card" id="quiz-container">
        <div class="q-number-badge" id="q-num">1</div>
        <div class="question-text" id="q-text">Loading question...</div>
        <div class="options-list" id="options-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h3>انتهى الاختبار!</h3>
        <p id="final-stats"></p>
        <button onclick="location.reload()" class="next-btn" style="display: block;">إعادة المحاولة</button>
    </div>

<script>
    const questions = [
        { q: "As regards communication, barriers of messages include which of the following?", o: ["Easy messages", "Relevant messages", "Unclear messages", "Complete messages"], c: 2 },
        { q: "Which of the following is the definition of motivation?", o: ["It is internal force that initiates and directs the individual to act in a certain manner to satisfy needs.", "It is external force", "Both 1 and 4", "Motivation starts with need, vision, dream"], c: 2 },
        { q: "As regards the role of the teacher, which of the following is not correct?", o: ["Planner", "Clarifier", "Stimulator", "Volunteer"], c: 3 },
        { q: "Group approach method of education includes which of the following?", o: ["Television", "Home visit", "Lecture", "Internet"], c: 2 },
        { q: "As regards importance of motivation, which of the following is not correct?", o: ["Activate behavior", "Give direction", "Increase productivity", "Passive participation"], c: 3 },
        { q: "Which is correct for essentials of communication?", o: ["Do not react instantly and mutter in anger", "Go to the conclusion", "Interrupt the speaker", "Use medical terminology difficult to be understood"], c: 0 },
        { q: "Which of the following is considered correct for verbal communication?", o: ["Need words to express emotions", "Active listening", "Direct questioning", "All the above"], c: 3 },
        { q: "Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "More reliable than verbal communication", "Do not need observation", "Cannot be used with deaf and mute persons"], c: 1 },
        { q: "Which is correct for an effective verbal communicator?", o: ["Encourages empathically", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },
        { q: "Which of the following are levels of communication?", o: ["Downwards communication", "Upwards communication", "Horizontal communication", "All the above"], c: 3 },
        { q: "Which of the following are correct for nonverbal communication?", o: ["Use body language", "Facial expression, eye contact and touch appearance", "Cannot use words", "All the above"], c: 3 },
        { q: "Risk factors that cause health education problems include:", o: ["Good staff training", "Spend time to interact properly with clients", "Good interest in the subject", "Lack staff training"], c: 3 },
        { q: "Group approach of health education include which of the following?", o: ["Internet", "Lectures, workshops and conferences", "Home visit", "Television"], c: 1 },
        { q: "Which of the following are the advantages of group teaching?", o: ["Include small group only", "Economic and give positive attitude development", "High cost", "Lack of sharing between learners"], c: 1 },
        { q: "As regards importance of motivation, which of the following is not correct?", o: ["Intrinsic force", "Give direction", "Increase productivity", "Extrinsic force"], c: 3 },
        { q: "Defined as two-way process involving passing messages to and from between sender and receiver:", o: ["Motivation", "Communication", "Health education code of ethics", "Learning"], c: 1 },
        { q: "Which of the following is considered correct for nonverbal communication?", o: ["Need words to express emotions", "Need observation and understanding", "Direct questioning", "Need voice"], c: 1 },
        { q: "Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "Non reliable than verbal communication", "Do not need observation", "Use body language"], c: 3 },
        { q: "Which is correct for an effective verbal communicator?", o: ["Direct clear questioning", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },
        { q: "Which of the following is a type of communication?", o: ["Downwards communication", "Upwards communication", "Horizontal communication", "All the above"], c: 3 },
        { q: "Which of the following is not correct about the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "Non appropriate channel"], c: 3 },
        { q: "An effective verbal communicator include:", o: ["Clarifies, listens, acknowledges and repeats", "Relaxes", "Opens up", "Eye contact"], c: 0 },
        { q: "Which of the following are the types of communication?", o: ["Verbal only", "Nonverbal only", "Intermediate", "Verbal and nonverbal"], c: 3 },
        { q: "Which of the following are correct for verbal communication?", o: ["Use body language", "Use words in communication", "Facial expression, eye contact and touch appearance", "Cannot use words"], c: 1 },
        { q: "Which of the following is not the level of communication?", o: ["Downward communication", "Upwards communication", "Lateral communication", "Vertical communication"], c: 2 },
        { q: "Which of the following are characters of a good sender message in communication?", o: ["Choose appropriate communication channel", "Be interested in the subject", "Both 1 and 2", "Lack interest of subject"], c: 2 },
        { q: "The person to whom messages is directed.", o: ["Sender", "Receiver", "Channel", "Messages"], c: 1 },
        { q: "Final stage that the receiver replies to the sender according to understanding:", o: ["Sending", "Communication", "Feedback", "Receiving"], c: 2 },
        { q: "As regards nonverbal communication advantages, which is correct?", o: ["Need words", "Do not need understanding or interpretation", "More reliable than verbal", "Need high voice"], c: 2 },
        { q: "All the following are requirements of effective communication EXCEPT:", o: ["Clear messages", "Relevant messages", "Meaningful messages", "Non relevant messages"], c: 3 },
        { q: "Criteria of effective nonverbal communicator include:", o: ["Use clear voice", "Establish eye contact with facial expression", "Use words", "Use meaningful speech"], c: 1 },
        { q: "Which is considered as a barrier of communication:", o: ["Proper channel", "Improper channel", "Good channel", "Relevant channel"], c: 1 },
        { q: "Teaching is defined as:", o: ["Interaction to bring expected changes in behavior", "Interaction between learners", "Interaction between groups", "Interaction between clients"], c: 0 },
        { q: "As regard rules of motivation which is correct?", o: ["Do not finish what you start", "Do not socialize", "Take risk and set a major goal", "Do not learn how to learn"], c: 2 },
        { q: "Which of the following is not a barrier of communication?", o: ["Lack of interest", "Good language use", "Anxiety", "Impaired visual channel"], c: 1 },
        { q: "Which are considered barriers of messages in communication?", o: ["Difficult and irrelevant messages", "Very easy messages", "Clear messages", "Complete messages"], c: 0 },
        { q: "For uncomfortable settings, which is correct?", o: ["Irrelevant", "Not essentials", "Are barriers of communication", "Receiver can concentrate"], c: 2 },
        { q: "As regards upwards communication which is true?", o: ["From below downward", "Nondirective", "Give information", "All the above"], c: 3 },
        { q: "Which is considered correct for verbal communication?", o: ["Need open-ended technique", "Close-ended technique", "Open and close-ended technique", "Not relevant"], c: 2 },
        { q: "Which is correct for nonverbal communication?", o: ["Direct questioning", "Need words", "Less conscious control over behavior", "Good conscious control"], c: 2 },
        { q: "Which is the characteristic of nonverbal communication?", o: ["Need good observation", "More reliable than verbal", "Need interpretation", "All the above"], c: 3 },
        { q: "Which is the disadvantage of individual approach teaching?", o: ["High cost", "Economic", "Positive attitude development", "Low cost"], c: 0 },
        { q: "Which is correct for the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "All the above"], c: 3 },
        { q: "As regards communication, feedback should not be:", o: ["Absent feedback", "Relevant feedback", "Good feedback", "Complete feedback"], c: 0 },
        { q: "Responsibility of sender is:", o: ["Discourage his receivers", "Encourage the receivers", "Has no relation", "Work alone"], c: 1 },
        { q: "Which of the following is the definition of health education?", o: ["Experience designed to facilitate voluntary action", "Unvoluntary action", "It is force", "Unhealthy behavior"], c: 0 },
        { q: "As regard the role of the teacher which is not correct?", o: ["Planner", "Clarifier", "Stimulator", "Volunteer"], c: 3 },
        { q: "As regard nonverbal communication represents:", o: ["90%", "80%", "70%", "10%"], c: 0 },
        { q: "Which is considered correct for verbal communication?", o: ["Need words to express emotions", "Active listening", "Direct questioning", "All the above"], c: 3 },
        { q: "Which is the characteristic of nonverbal communication?", o: ["Easy communication", "NOT reliable", "Do not need observation", "Used with deaf and mute"], c: 1 }
    ];

    let currentIdx = 0;
    let score = 0;
    let answeredCount = 0;

    function initQuiz() {
        const q = questions[currentIdx];
        document.getElementById("q-num").innerText = currentIdx + 1;
        document.getElementById("q-text").innerText = q.q;
        document.getElementById("next-btn").style.display = "none";
        
        const box = document.getElementById("options-box");
        box.innerHTML = "";
        
        q.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, btn);
            box.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, btn) {
        const correctIdx = questions[currentIdx].c;
        const allButtons = document.querySelectorAll(".option-btn");
        
        // تعطيل كل الأزرار فور الاختيار (تثبيت الإجابة)
        allButtons.forEach(b => b.disabled = true);
        
        if(selectedIdx === correctIdx) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            allButtons[correctIdx].classList.add("correct");
        }

        answeredCount++;
        updateStats();
        document.getElementById("next-btn").style.display = "block";
    }

    function updateStats() {
        document.getElementById("stat-answered").innerText = answeredCount;
        document.getElementById("stat-correct").innerText = score;
        const percent = Math.round((score / answeredCount) * 100);
        document.getElementById("stat-percent").innerText = percent + "%";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            initQuiz();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-stats").innerText = `لقد أجبت على ${score} من إجمالي ${questions.length} سؤال بشكل صحيح.`;
    }

    initQuiz();
</script>
</body>
</html>
