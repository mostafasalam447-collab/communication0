<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Exam - 200 Questions</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .quiz-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .progress { font-weight: bold; color: var(--secondary); font-size: 1.1rem; }
        .question-text { font-size: 1.3rem; line-height: 1.6; color: var(--primary); margin-bottom: 25px; text-align: left; direction: ltr; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn { padding: 15px; text-align: left; background: #fff; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 1rem; direction: ltr; }
        .option-btn:hover { border-color: var(--secondary); background: #f0f7ff; }
        .result-screen { text-align: center; display: none; }
        .score { font-size: 3rem; color: var(--success); margin: 20px 0; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <span class="progress" id="progress-text">السؤال 1 من 200</span>
        </div>

        <div class="options-grid" id="options-container"></div>

    <div id="result-ui" class="result-screen">
        <h2>اكتمل الاختبار!</h2>
        <div class="score" id="final-score">0</div>
        <p id="score-details"></p>
        <button onclick="location.reload()" style="padding: 10px 25px; background: var(--secondary); color: white; border: none; border-radius: 5px; cursor: pointer;">إعادة الاختبار</button>
    </div>
</div>

    let currentIdx = 0;
    let score = 0;

    function initQuiz() {
        if (currentIdx < quizData.length) {
            const data = quizData[currentIdx];
            document.getElementById("progress-text").innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
            document.getElementById("question-body").innerText = data.q;
            
            const container = document.getElementById("options-container");
            container.innerHTML = "";
            
            data.a.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(i);
                container.appendChild(btn);
            });
        } else {
            showResults();
        }
    }

    function handleAnswer(selected) {
        if (selected === quizData[currentIdx].c) {
            score++;
        }
        currentIdx++;
        initQuiz();
    }

    function showResults() {
        document.getElementById("quiz-ui").style.display = "none";
        document.getElementById("result-ui").style.display = "block";
        document.getElementById("final-score").innerText = `${Math.round((score / quizData.length) * 100)}%`;
        document.getElementById("score-details").innerText = `You scored ${score} out of ${quizData.length}`;
    }

    initQuiz();
