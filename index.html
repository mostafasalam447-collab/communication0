<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Bank - 100 Questions</title>
    <style>
        :root {
            --primary: #004a7c;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-stats {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg);
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 700px;
        }

        .stat-card {
            background: var(--white);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        .stat-value {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
        }

        .questions-container {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }

        .quiz-card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        .q-number-badge {
            position: absolute;
            top: 15px;
            left: 10px; /* موضع ثابت لليسار */
            background: var(--secondary);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.15rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 20px;
            margin-top: 5px;
            margin-left: 45px; /* تم زيادة المسافة لإبعاد النص عن الدائرة */
            line-height: 1.6;
            text-align: left;
            direction: ltr;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 45px; /* محاذاة الخيارات مع السؤال */
        }

        .option-btn {
            background: var(--white);
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-align: left;
            direction: ltr;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f7ff;
            border-color: var(--secondary);
        }

        .correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24 !important;
        }

        .submit-all {
            margin: 40px 0;
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-stats">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="stat-total">100</span>
                <span class="stat-label">الإجمالي</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-answered">0</span>
                <span class="stat-label">أجبت</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-correct" style="color: var(--success);">0</span>
                <span class="stat-label">صحيحة</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-percent">0%</span>
                <span class="stat-label">النجاح</span>
            </div>
        </div>
    </div>

    <div class="questions-container" id="main-container"></div>

    <button class="submit-all" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">العودة للأعلى</button>

        { q: "Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "More reliable than verbal communication", "Do not need observation", "Cannot be used with deaf and mute persons"], c: 1 },

        { q: "Which of the following are correct for nonverbal communication?", o: ["Use body language", "Facial expression, eye contact and touch appearance", "Cannot use words", "All the above"], c: 3 },
        { q: "Risk factors that cause health education problems include:", o: ["Good staff training", "Spend time to interact properly with clients", "Good interest in the subject", "Lack staff training"], c: 3 },
        { q: "Group approach of health education include which of the following?", o: ["Internet", "Lectures, workshops and conferences", "Home visit", "Television"], c: 1 },
        { q: "Which of the following are the advantages of group teaching?", o: ["Include small group only", "Economic and give positive attitude development", "High cost", "Lack of sharing between learners"], c: 1 },
        { q: "As regards importance of motivation, which of the following is not correct?", o: ["Intrinsic force", "Give direction", "Increase productivity", "Extrinsic force"], c: 3 },
        { q: "Defined as two-way process involving passing messages to and from between sender and receiver:", o: ["Motivation", "Communication", "Health education code of ethics", "Learning"], c: 1 },
        { q: "Which of the following is considered correct for nonverbal communication?", o: ["Need words to express emotions", "Need observation and understanding", "Direct questioning", "Need voice"], c: 1 },
        { q: "Which of the following is the characteristic of nonverbal communication?", o: ["Easy communication", "Non reliable than verbal communication", "Do not need observation", "Use body language"], c: 3 },
        { q: "Which is correct for an effective verbal communicator?", o: ["Direct clear questioning", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },

        { q: "Which of the following are the types of communication?", o: ["Verbal only", "Nonverbal only", "Intermediate", "Verbal and nonverbal"], c: 3 },
        { q: "Which of the following are correct for verbal communication?", o: ["Use body language", "Use words in communication", "Facial expression, eye contact and touch appearance", "Cannot use words"], c: 1 },
        { q: "Which of the following is not the level of communication?", o: ["Downward communication", "Upwards communication", "Lateral communication", "Vertical communication"], c: 2 },
        { q: "Which of the following are characters of a good sender message in communication?", o: ["Choose appropriate communication channel", "Be interested in the subject", "Both 1 and 2", "Lack interest of subject"], c: 2 },
        { q: "… is the person to whom messages is directed.", o: ["Sender", "Receiver", "Channel", "Messages"], c: 1 },
        { q: "Final stage that the receiver replies to the sender according to understanding:", o: ["Sending", "Communication", "Feedback", "Receiving"], c: 2 },
        { q: "As regards nonverbal communication advantages, which is correct?", o: ["Need words", "Do not need understanding or interpretation", "More reliable than verbal", "Need high voice"], c: 2 },
        { q: "All the following are requirements of effective communication EXCEPT:", o: ["Clear messages", "Relevant messages", "Meaningful messages", "Non relevant messages"], c: 3 },
        { q: "Criteria of effective nonverbal communicator include:", o: ["Use clear voice", "Establish eye contact with facial expression", "Use words", "Use meaningful speech"], c: 1 },
        { q: "Which is considered as a barrier of communication:", o: ["Proper channel", "Improper channel", "Good channel", "Relevant channel"], c: 1 },
        { q: "Teaching is defined as:", o: ["Interaction to bring expected changes in behavior", "Interaction between learners", "Interaction between groups", "Interaction between clients"], c: 0 },
        { q: "As regard rules of motivation which is correct?", o: ["Do not finish what you start", "Do not socialize", "Take risk and set a major goal", "Do not learn how to learn"], c: 2 },

        { q: "For uncomfortable settings, which is correct?", o: ["Irrelevant", "Not essentials", "Are barriers of communication", "Receiver can concentrate"], c: 2 },
        { q: "As regards upwards communication which is true?", o: ["From below downward", "Nondirective", "Give information", "All the above"], c: 3 },
        { q: "Which is considered correct for verbal communication?", o: ["Need open-ended technique", "Close-ended technique", "Open and close-ended technique", "Not relevant"], c: 2 },
        { q: "Which is correct for nonverbal communication?", o: ["Direct questioning", "Need words", "Less conscious control over behavior", "Good conscious control"], c: 2 },
        { q: "Which is the characteristic of nonverbal communication?", o: ["Need good observation", "More reliable than verbal", "Need interpretation", "All the above"], c: 3 },
        { q: "Which is the disadvantage of individual approach teaching?", o: ["High cost", "Economic", "Positive attitude development", "Low cost"], c: 0 },
        { q: "Which is correct for the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "All the above"], c: 3 },
        { q: "As regards communication, feedback should not be:", o: ["Absent feedback", "Relevant feedback", "Good feedback", "Complete feedback"], c: 0 },
        { q: "Responsibility of sender is:", o: ["Discourage his receivers", "Encourage the receivers", "Has no relation", "Work alone"], c: 1 },
        { q: "Which of the following is the definition of health education?", o: ["Experience designed to facilitate voluntary action", "Unvoluntary action", "It is force", "Unhealthy behavior"], c: 0 },
        { q: "As regard the role of the teacher which is not correct?", o: ["Planner", "Clarifier", "Stimulator", "Volunteer"], c: 3 },
        { q: "As regard nonverbal communication represents:", o: ["90%", "80%", "70%", "10%"], c: 0 },
        { q: "Which is considered correct for verbal communication?", o: ["Need words to express emotions", "Active listening", "Direct questioning", "All the above"], c: 3 },
        { q: "Which is the characteristic of nonverbal communication?", o: ["Easy communication", "NOT reliable", "Do not need observation", "Used with deaf and mute"], c: 1 },
        
        // 51-100
        { q: "Which is correct for an effective verbal communicator?", o: ["Encourages empathically", "Depend on eye contact", "Depend on facial expression", "Depend on body language"], c: 0 },
        { q: "Which of the following is a level of communication?", o: ["Downwards communication", "Upwards communication", "Horizontal communication", "All the above"], c: 3 },
        { q: "Which of the following is correct about the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "All the above"], c: 3 },
        { q: "Which of the following are correct for nonverbal communication?", o: ["Use body language", "Facial expression", "Eye contact", "All the above"], c: 3 },
        { q: "Which of the following are considered methods of nonverbal communication?", o: ["Use high sounds", "Use clear words", "Use understanding words", "Use body language"], c: 3 },
        { q: "Which of the following is considered true for verbal communication?", o: ["Use words in communication", "Eye to eye contact", "Facial expression", "Touch"], c: 0 },
        { q: "For nonverbal communication, method which is not correct?", o: ["More reliable", "Not reliable", "Touch receiver", "Eye to eye contact"], c: 1 },
        { q: "An effective verbal communication includes which of the following?", o: ["Clarifies, listens, acknowledges, and repeats", "Relax", "Open up", "Eye contact"], c: 0 },
        { q: "Which of the following is the type of communication?", o: ["Verbal only", "Nonverbal only", "Intermediate", "Verbal and nonverbal communication"], c: 3 },
        { q: "Which of the following is NOT the level of communication?", o: ["Downward communication", "Upwards communication", "Lateral communication", "Vertical communication"], c: 2 },
        { q: "… defined as two-way process involving passing messages to and from between sender and receiver?", o: ["Motivation", "Communication", "Health education code of ethics", "Learning"], c: 1 },
        { q: "Which of the following is not correct about the characteristic of good communicator channel?", o: ["Appropriate", "Affordable", "Appealing", "Non appropriate channel"], c: 3 },
        { q: "Refers to the way by which the message is sent.", o: ["Channel", "Feedback", "Message", "Conversation"], c: 0 },
        { q: "Which of the following are character of good senders?", o: ["Know the subject well", "Be interested in the subject", "Know the audience member", "All of the above"], c: 3 },
        { q: "Which of the following are correct for verbal communication?", o: ["Use touch", "Use words in communication", "Facial expression", "Use eye contact"], c: 1 },
        { q: "Which of the following is true for downward communication?", o: ["From seniors to juniors", "Directive", "Give orders", "All the above"], c: 3 },
        { q: "Effective communication needs messages to be:", o: ["Timely", "Meaningful", "Both 1 and 2", "Not suitable to the situation"], c: 2 },
        { q: "The upwards communication is:", o: ["From junior to senior", "From senior to junior", "Between students", "Directive"], c: 0 },
        { q: "… is the final stage that the receiver replies to the sender according to understanding him to a particular topic", o: ["Sending", "Communication", "Feedback", "Receiving"], c: 2 },
        { q: "As regard nonverbal communication advantages which is correct?", o: ["Need words", "Do not need understanding or interpretation", "Use with deaf and mute persons", "Need high voice"], c: 1 },
        { q: "The following is character of good receiver:", o: ["Aware", "Interested, willing to accept message", "Understand the value of message", "All the above"], c: 3 },
        { q: "Criteria of effective nonverbal communicator include which of the following?", o: ["Use clear voice", "Establish eye contact with appropriate facial expression", "Relaxes", "2 + 3"], c: 3 },
        { q: "Health education code of ethics is defined as:", o: ["Framework of shared values within which health education is practiced", "Interaction between learners and clients", "Interaction between doctors", "Interaction between students"], c: 0 },
        { q: "Which of the following is correct for good nonverbal communication?", o: ["Need good observation", "Good analysis", "Good interpretation", "All the above"], c: 3 },
        { q: "Upward communication which is correct?", o: ["Nondirective", "From junior to senior", "Inform problem", "All the above"], c: 3 },
        { q: "Which is correct for downward communication?", o: ["From senior to junior", "Nondirective", "From junior to senior", "Inform problem"], c: 0 },
        { q: "Which is correct for lateral communication?", o: ["Between colleagues", "At the same level", "Share information to save time", "All the above"], c: 3 },
        { q: "For good receiver, which is correct?", o: ["Should be aware", "Not listen well", "Neglect the subject", "Don't have interest"], c: 0 },
        { q: "Which of the following are barriers for communication?", o: ["Have no interest", "Anxiety", "Impaired visual and auditory channel", "All the above"], c: 3 },
        { q: "Which of the following are essentials for good communication?", o: ["Good atmosphere", "Comfortable setting", "Good light", "All the above"], c: 3 },
        { q: "Effective communication requires message should be:", o: ["Hazy message", "Unclear message", "Irrelevant message", "Clear, concise, and accurate"], c: 3 },
        { q: "Which of the following is considered correct for body language in communication?", o: ["Can use touch", "Cannot use eye contact", "Not important in communication", "Irrelevant"], c: 0 },
        { q: "Which of the following is true for a student?", o: ["He is sender", "He is receiver", "He is teacher", "He cannot give feedback"], c: 1 },
        { q: "… is basic component of human relationship.", o: ["Education", "Communication", "Teaching", "Learning"], c: 1 },
        { q: "Which of the following is correct for teacher?", o: ["He is good sender", "He is receiver", "He is learner", "He is patient"], c: 0 },
        { q: "What is the responsibility of health education?", o: ["To meet the challenges of the new millennium", "Has no role", "Has minimal role in maintaining health", "Cannot encourage his team"], c: 0 },
        { q: "Which of the following are ways and methods of health education?", o: ["Direct methods only", "Indirect methods only", "Direct and indirect methods", "Mass media"], c: 2 },
        { q: "What are the levels of health education?", o: ["Individual approach", "Group approach", "General approach", "All the above"], c: 3 },
        { q: "Which are advantages of individual approach?", o: ["Flexibility", "Promote opportunity", "Building up motivation", "All the above"], c: 3 },
        { q: "Which is correct for lateral communication?", o: ["Between colleagues", "From seniors", "From juniors", "From seniors to juniors"], c: 0 },
        { q: "For good sender which is correct?", o: ["Should speak at the level of audience", "Not listen well", "Neglect the subject", "Do not have interest"], c: 0 },
        { q: "Which of the following are disadvantages of individual health education?", o: ["High cost of teaching team", "Lack of sharing between team", "1 + 2", "Low cost"], c: 2 },
        { q: "Which of the following are essentials for good communication?", o: ["Good atmosphere", "Comfortable setting", "Good light", "All the above"], c: 3 },
        { q: "Small group teaching includes:", o: ["2–5 individuals", "6–30 individuals", "40 individuals", "60 individuals"], c: 0 },
        { q: "Medium sized group include:", o: ["2–5 individuals", "6–30 individuals", "40 individuals", "60 individuals"], c: 1 },
        { q: "Which of the following is true for large group teaching?", o: ["Economic", "Foster positive attitude of development", "Mass media", "All the above"], c: 3 },
        { q: "Prenatal care is considered:", o: ["Small size group of health education", "Medium sized group", "Large size group", "Learning"], c: 2 },
        { q: "Which of the following is correct for individual approach?", o: ["Home visit", "Personal contact", "Personal letters", "All the above"], c: 3 },
        { q: "Group approach of health education include:", o: ["Lectures", "Conferences", "Workshops", "All the above"], c: 3 },
        { q: "Which of the following is correct for mass approach of health education?", o: ["Mass media", "Television", "Radio", "All the above"], c: 3 }
    ];

    let score = 0;
    let answered = 0;

    function buildQuiz() {
        const container = document.getElementById("main-container");
        questions.forEach((item, qIdx) => {
            const card = document.createElement("div");
            card.className = "quiz-card";
            card.id = `card-${qIdx}`;

            card.innerHTML = `
                <div class="q-number-badge">${qIdx + 1}</div>
                <div class="question-text">${item.q}</div>
                <div class="options-list" id="options-${qIdx}"></div>
            `;
            container.appendChild(card);

            const optionsBox = document.getElementById(`options-${qIdx}`);
            item.o.forEach((opt, oIdx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleChoice(qIdx, oIdx, btn);
                optionsBox.appendChild(btn);
            });
        });
    }

    function handleChoice(qIdx, oIdx, clickedBtn) {
        const optionsBox = document.getElementById(`options-${qIdx}`);
        const buttons = optionsBox.querySelectorAll(".option-btn");
        const correctIdx = questions[qIdx].c;

        buttons.forEach(btn => btn.disabled = true);

        if (oIdx === correctIdx) {
            clickedBtn.classList.add("correct");
            score++;
        } else {
            clickedBtn.classList.add("wrong");
            buttons[correctIdx].classList.add("correct");
        }

        answered++;
        updateHeader();
    }

    function updateHeader() {
        document.getElementById("stat-answered").innerText = answered;
        document.getElementById("stat-correct").innerText = score;
        const percent = Math.round((score / answered) * 100);
        document.getElementById("stat-percent").innerText = percent + "%";
    }

    buildQuiz();
</script>
</body>
</html>
